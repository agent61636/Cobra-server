# forms.songofeo.com: the website's own form receiver (cobra-forms, apps/forms in cobra-server).
# Its own file next to songofeo.conf, so nothing in that file changes. The shared TLS and proxy
# settings at the top of songofeo.conf apply here too (nginx reads every conf.d/*.conf into one http block).
#   /f/<form>  PUBLIC on purpose: anyone on the internet can send a form, so no sign-in here.
#              Guarded by its own rate limit, a size cap, POST only, and the app's own checks.
#   /inbox     the saved submissions: Authelia sign-in + TOTP, and only the users Authelia's rule names.
limit_req_zone $binary_remote_addr zone=forms:1m rate=10r/m;

server {
  listen 443 ssl; http2 on; server_name forms.songofeo.com;
  client_max_body_size 8m;          # the enlistment's filecard art (the page shrinks it to well under 5 MB)

  location /internal/authelia/authz {
    internal;
    proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length ""; proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
  }

  location /f/ {
    limit_except POST { deny all; }
    limit_req zone=forms burst=5 nodelay;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:8097;   # headers (X-Real-IP = the visitor, Remote-User emptied) come from songofeo.conf
  }

  location = /health {
    limit_req zone=perip burst=20 nodelay;
    proxy_pass http://127.0.0.1:8097;
  }

  location /inbox {
    auth_request /internal/authelia/authz;
    auth_request_set $redirection_url $upstream_http_location;
    auth_request_set $forms_user $upstream_http_remote_user;
    error_page 401 =302 $redirection_url;
    limit_req zone=perip burst=50 nodelay;
    # Setting one header here drops the inherited ones, so all of them are listed again.
    proxy_set_header Host $host;  proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;  proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Remote-User $forms_user;   # who Authelia signed in; the app checks it again
    proxy_pass http://127.0.0.1:8097;
  }

  location / { return 404; }
}
