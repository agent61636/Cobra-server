<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobra Arcade High Scores</title>
<style>
  :root {
    --bg: #07060d; --panel: #110f1e; --line: #2a2550; --text: #e9e6ff; --dim: #8d86b8;
    --neon: #ff2e88; --cyan: #29e7ff; --gold: #ffd23f; --green: #5dff8a;
    --font: "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body::after { /* CRT scanlines */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);
  }
  header { text-align: center; padding: 28px 16px 10px; }
  h1 {
    margin: 0; font-size: clamp(26px, 6vw, 54px); letter-spacing: .12em; text-transform: uppercase;
    color: var(--neon); text-shadow: 0 0 6px var(--neon), 0 0 22px rgba(255,46,136,.6);
  }
  .sub { margin-top: 6px; color: var(--cyan); letter-spacing: .3em; font-size: 13px; text-transform: uppercase;
         text-shadow: 0 0 8px rgba(41,231,255,.6); }
  .insert { color: var(--gold); animation: blink 1.2s steps(1) infinite; font-size: 12px; margin-top: 10px; letter-spacing: .25em; }
  @keyframes blink { 50% { opacity: 0; } }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 12px 16px 6px; }
  input, select {
    background: var(--panel); color: var(--text); border: 2px solid var(--line); padding: 10px 12px;
    font: inherit; font-size: 15px; border-radius: 0; min-width: 0;
  }
  input { width: min(360px, 100%); }
  input:focus, select:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 10px rgba(41,231,255,.4); }
  .meta { text-align: center; color: var(--dim); font-size: 12px; padding: 4px 16px 14px; }
  main { display: grid; gap: 16px; padding: 0 16px 40px; max-width: 1200px; margin: 0 auto;
         grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--panel); border: 2px solid var(--line); padding: 14px; position: relative; }
  .card.fresh { border-color: var(--neon); box-shadow: 0 0 14px rgba(255,46,136,.35); }
  .badge { position: absolute; top: -10px; right: 10px; background: var(--neon); color: #000; font-weight: bold;
           font-size: 11px; padding: 2px 6px; letter-spacing: .1em; }
  .title { font-size: 18px; color: var(--gold); text-transform: uppercase; letter-spacing: .06em;
           overflow-wrap: anywhere; text-shadow: 0 0 6px rgba(255,210,63,.4); }
  .rom { color: var(--dim); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .tag { display: inline-block; border: 1px solid var(--cyan); color: var(--cyan); font-size: 11px; padding: 1px 6px;
         margin-top: 8px; text-transform: uppercase; letter-spacing: .08em; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  td { padding: 3px 0; }
  td.rank { color: var(--cyan); width: 3ch; }
  td.score { text-align: right; color: var(--green); }
  td.name { padding-left: 12px; letter-spacing: .1em; }
  .saved { margin-top: 12px; color: var(--green); font-size: 13px; letter-spacing: .08em; }
  .foot { margin-top: 12px; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  a { color: var(--cyan); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--dim); padding: 40px 0; line-height: 1.8; }
</style>
</head>
<body>
<header>
  <h1>Cobra Arcade</h1>
  <div class="sub">High score board</div>
  <div class="insert">Newest scores first</div>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off">
  <select id="system" aria-label="System"><option value="">All systems</option></select>
</div>
<div class="meta" id="meta">Loading…</div>
<main id="grid" aria-live="polite"></main>
<script>
(() => {
  const grid = document.getElementById("grid"), meta = document.getElementById("meta");
  const q = document.getElementById("q"), sys = document.getElementById("system");
  let games = [];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pretty = g => g.title || g.game.replace(/[_-]+/g, " ");
  function ago(iso) {
    const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (s < 60) return "just now";
    const units = [["year", 31536000], ["month", 2592000], ["day", 86400], ["hour", 3600], ["minute", 60]];
    for (const [u, n] of units) if (s >= n) { const v = Math.floor(s / n); return `${v} ${u}${v > 1 ? "s" : ""} ago`; }
  }
  function card(g) {
    const fresh = Date.now() - Date.parse(g.updated_at) < 86400000;
    const rows = (g.decoded || []).slice(0, 5).map(r =>
      `<tr><td class="rank">${esc(r.rank)}</td><td class="score">${esc(r.score)}</td><td class="name">${esc(r.name)}</td></tr>`).join("");
    const body = rows ? `<table>${rows}</table>` : `<div class="saved">&#9733; Score table saved</div>`;
    const file = `api/v1/files/${encodeURIComponent(g.system)}/${encodeURIComponent(g.name)}`;
    return `<article class="card${fresh ? " fresh" : ""}">
      ${fresh ? '<span class="badge">NEW</span>' : ""}
      <div class="title">${esc(pretty(g))}</div>
      <div class="rom">${esc(g.name)}</div>
      <span class="tag">${esc(g.system)}</span>
      ${body}
      <div class="foot"><span title="${esc(g.updated_at)}">Updated ${esc(ago(g.updated_at))}</span>
        <span>${g.versions} version${g.versions === 1 ? "" : "s"} · <a href="${file}">download</a></span></div>
    </article>`;
  }
  function render() {
    const term = q.value.trim().toLowerCase(), s = sys.value;
    const shown = games.filter(g => (!s || g.system === s) &&
      (!term || g.game.toLowerCase().includes(term) || (g.title || "").toLowerCase().includes(term)));
    grid.innerHTML = shown.length ? shown.map(card).join("")
      : `<div class="empty">${games.length ? "No games match." : "No scores yet.<br>Play a game on the cabinet, set a score, and quit to the menu."}</div>`;
    meta.textContent = `${shown.length} of ${games.length} games · refreshed ${new Date().toLocaleTimeString()}`;
  }
  async function load() {
    try {
      const r = await fetch("api/v1/games", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      games = await r.json();
      const known = new Set([...sys.options].map(o => o.value));
      for (const s of [...new Set(games.map(g => g.system))].sort())
        if (!known.has(s)) sys.add(new Option(s, s));
      render();
    } catch (e) { meta.textContent = "Can't reach the score server right now. Retrying…"; }
  }
  q.addEventListener("input", render); sys.addEventListener("change", render);
  load(); setInterval(load, 60000);
})();
</script>
</body>
</html>
