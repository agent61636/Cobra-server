<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Song of Eo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&family=Michroma&display=swap">
<style>
/* Layout: one fixed scene. Space backdrop fills the screen (cropped as needed);
   the station layer is a square that always fits, centered under the title. */
:root {
  --void: #020308;
  --hull-hi: #59626e;
  --ink: #e6ebf1;
  --muted: #8f9aa8;
  --blood: #c1121f;
  --ember: #ff6a3d;
  --gold: #c9a13b;
  --silver: #aeb7c2;
  --display: "Michroma", "Eurostile", "Arial Narrow", sans-serif;
  --body: "Exo 2", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--body); overflow: hidden; }

.scene { position: fixed; inset: 0; animation: wake 3.4s ease-out both; }
@keyframes wake {
  0% { filter: blur(14px) brightness(.25); }
  55% { filter: blur(4px) brightness(.7); }
  100% { filter: none; }
}
.backdrop { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 2.5vh) 16px calc(env(safe-area-inset-bottom, 0px) + 8px); box-sizing: border-box; }
header { text-align: center; display: grid; gap: .55rem; flex: none; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4.6vw, 60px);
  letter-spacing: .2em; padding-left: .2em; color: var(--ink); text-wrap: balance;
  text-shadow: 0 0 18px rgba(160, 190, 230, .25); }
.sub { margin: 0; font-weight: 600; font-size: clamp(10px, 1.35vw, 15px); letter-spacing: .42em; padding-left: .42em;
  color: var(--muted); text-transform: uppercase; }
.sub b { color: var(--blood); font-weight: 600; text-shadow: 0 0 10px rgba(193, 18, 31, .55); }

.station { flex: 1; min-height: 0; width: 100%; max-width: 1200px; display: block; overflow: visible; }

footer { flex: none; font-size: 11px; letter-spacing: .08em; color: rgba(255, 230, 220, .55); text-align: center; }

/* Eyelids */
.lid { position: fixed; left: -10vw; right: -10vw; height: 62vh; background: #000; z-index: 10; pointer-events: none; }
.lid.top { top: 0; border-radius: 0 0 50% 50% / 0 0 38% 38%; animation: lidTop 3.2s cubic-bezier(.6, .05, .25, 1) forwards; }
.lid.bot { bottom: 0; border-radius: 50% 50% 0 0 / 38% 38% 0 0; animation: lidBot 3.2s cubic-bezier(.6, .05, .25, 1) forwards; }
@keyframes lidTop { 0% { transform: translateY(0); } 30% { transform: translateY(-28%); } 42% { transform: translateY(-12%); } 100% { transform: translateY(-112%); } }
@keyframes lidBot { 0% { transform: translateY(0); } 30% { transform: translateY(28%); } 42% { transform: translateY(12%); } 100% { transform: translateY(112%); } }

/* Interactive bays */
.bay { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .35s cubic-bezier(.2, .8, .2, 1), filter .35s; }
.bay:hover, .bay:focus-visible { transform: scale(1.06); filter: drop-shadow(0 0 14px rgba(255, 210, 160, .35)); }
.bay:focus { outline: none; }
.bay:focus-visible .frame { stroke: #ffd9a8; stroke-width: 3; }
.bay .tag { font-family: var(--display); font-size: 11px; letter-spacing: .3em; fill: #f3e7d4; }
.bay .hint { font-family: var(--body); font-size: 9px; letter-spacing: .18em; fill: #c9b9a4; opacity: 0; transition: opacity .3s; }
.bay:hover .hint, .bay:focus-visible .hint { opacity: 1; }

.screen { animation: flicker 5s infinite; }
@keyframes flicker { 0%, 100% { fill: #f6e9cf; } 18% { fill: #cfe3ff; } 36% { fill: #ffd2a6; } 52% { fill: #e9f6ff; } 71% { fill: #ffb9a0; } 86% { fill: #fff3d8; } }
.beam { animation: beam 5s infinite; }
@keyframes beam { 0%, 100% { opacity: .16; } 30% { opacity: .1; } 60% { opacity: .2; } }
.eq rect { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite alternate; }
@keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
.onair { animation: onair 2.4s infinite; }
@keyframes onair { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
.px { animation: px 1.6s steps(1) infinite; }
@keyframes px { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .15; } }
.beacon { animation: beacon 1.8s infinite; }
@keyframes beacon { 0%, 70%, 100% { opacity: .15; } 75%, 90% { opacity: 1; } }
.ember { animation: ember 1.3s infinite alternate; }
@keyframes ember { from { opacity: .35; } to { opacity: .9; } }

.cone { transform-box: fill-box; transform-origin: center; animation: thump .46s ease-out infinite; }
@keyframes thump { 0% { transform: scale(1); } 18% { transform: scale(1.07); } 100% { transform: scale(1); } }
.wave { transform-box: view-box; transform-origin: 170px 495px; animation: wave 1.38s linear infinite; opacity: 0; }
@keyframes wave { 0% { transform: scale(.8); opacity: .75; } 100% { transform: scale(2.1); opacity: 0; } }

.banner { transform-box: fill-box; transform-origin: top center; animation: sway 4s ease-in-out infinite alternate; }
.banner.b2 { animation-delay: -2s; }
@keyframes sway { from { transform: skewX(-3deg); } to { transform: skewX(3deg); } }

.ship { cursor: pointer; }
.ship .bob { animation: bob 5s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.ship:hover .hull, .ship:focus-visible .hull { stroke: #d8c2ff; }
.ship:focus { outline: none; }
.rave { animation: rave 1.2s steps(6) infinite; }
@keyframes rave { 0% { fill: #ff2d6f; } 17% { fill: #ffb12d; } 33% { fill: #e9ff2d; } 50% { fill: #2dffa8; } 67% { fill: #2db8ff; } 83% { fill: #b02dff; } 100% { fill: #ff2d6f; } }
.ray { animation: ray 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
@keyframes ray { 0%, 100% { opacity: .1; transform: rotate(-8deg); } 50% { opacity: .5; transform: rotate(8deg); } }

.twinkle { animation: twinkle 3s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }

/* Playlist */
dialog { width: min(480px, calc(100vw - 32px)); box-sizing: border-box; border: 1px solid #3a3f4a; border-radius: 6px;
  background: #0b0d12; color: var(--ink); padding: 22px; font-family: var(--body); }
dialog::backdrop { background: rgba(0, 0, 0, .7); }
dialog h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 15px; letter-spacing: .24em; }
dialog p { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.tracks { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 6px; }
.tracks button { width: 100%; text-align: left; background: #141821; color: var(--ink); border: 1px solid #262c38; border-radius: 4px;
  padding: 10px 12px; font: inherit; font-size: 14px; cursor: pointer; display: grid; gap: 2px; }
.tracks button:hover, .tracks button:focus-visible, .tracks button[aria-current="true"] { border-color: #b02dff; outline: none; }
.tracks small { color: var(--muted); font-size: 12px; }
audio { width: 100%; margin-bottom: 14px; }
.close { background: none; border: 1px solid #3a3f4a; color: var(--ink); border-radius: 4px; padding: 8px 14px; font: inherit; cursor: pointer; }
.close:focus-visible { outline: 2px solid #ffd9a8; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .scene, .lid, .screen, .beam, .eq rect, .onair, .px, .beacon, .ember, .cone, .wave, .banner, .ship .bob, .rave, .ray, .twinkle { animation: none !important; }
  .lid { display: none; }
  .wave { opacity: .35; }
}
</style>
</head>
<body>

<div class="scene">
  <svg class="backdrop" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

    <circle cx="190" cy="360" r="50" fill="url(#earth)"></circle>
    <g clip-path="url(#earthclip)">

      <path d="M200 372 C214 366 228 372 232 386 C222 396 206 398 198 388 Z" fill="#6a8a46" opacity=".8"></path>
      <path d="M140 362 C170 352 200 352 236 344" stroke="#fff" stroke-opacity=".55" stroke-width="3" fill="none" stroke-linecap="round"></path>

      <path d="M156 318 C176 312 196 314 214 322" stroke="#fff" stroke-opacity=".45" stroke-width="2" fill="none" stroke-linecap="round"></path>
      <rect x="130" y="300" width="120" height="120" fill="url(#night)"></rect>
    </g>
    <circle cx="190" cy="360" r="50.5" fill="none" stroke="#9fd0ff" stroke-opacity=".5" stroke-width="1.2"></circle>
    <circle cx="268" cy="318" r="9" fill="#b9b6ae"></circle>
    <circle cx="271" cy="318" r="9" fill="#000" opacity=".55"></circle>

    <!-- Mars: only its crest rises at the bottom -->
    <circle cx="800" cy="2410" r="1716" fill="#ff8f5e" opacity=".22" filter="url(#haze)"></circle>
    <circle cx="800" cy="2410" r="1700" fill="url(#mars)"></circle>
    <g clip-path="url(#marsclip)">
      <g id="marsfeatures"></g>
      <path d="M380 780 C520 752 640 760 760 742 C860 728 960 744 1100 730" stroke="#4a160c" stroke-opacity=".55" stroke-width="9" fill="none" stroke-linecap="round" filter="url(#soft)"></path>
      <ellipse cx="800" cy="702" rx="260" ry="10" fill="#fff1e6" opacity=".14" filter="url(#soft)"></ellipse>
    </g>
    <circle cx="800" cy="2410" r="1700" fill="none" stroke="#ffb08a" stroke-opacity=".55" stroke-width="2"></circle>
  </svg>

  <div class="stage">
    <header>

      <p class="sub"><b>R</b>ebel <b>E</b>ntertainment <b>D</b>ivision</p>

        <clipPath id="wDeck"><rect x="322" y="238" width="296" height="42" rx="6"></rect></clipPath>
        <!-- Generic people, drawn as silhouettes -->
        <symbol id="seated" viewBox="0 0 30 40"><circle cx="15" cy="10" r="7"></circle><path d="M2 40 Q2 20 15 20 Q28 20 28 40 Z"></path></symbol>
        <symbol id="standing" viewBox="0 0 30 80"><circle cx="15" cy="9" r="7"></circle><path d="M5 20 Q15 16 25 20 L27 50 L21 50 L20 80 L10 80 L9 50 L3 50 Z"></path></symbol>
        <!-- Original howling-wolf mark for the banners -->
        <symbol id="wolf" viewBox="0 0 40 44"><path d="M9 43 L11 31 L8 25 L10 18 L14 15 L17 7 L19 1 L22 8 L27 5 L26 11 L30 14 L28 19 L23 20 L25 27 L30 34 L32 43 Z"></path></symbol>
      </defs>

      <!-- Solar wings: left intact, right shot away -->
      <g>
        <rect x="150" y="246" width="122" height="9" fill="#2a2f37"></rect>
        <g fill="#0f1a2c" stroke="#3b4a63" stroke-width="1.2">
          <rect x="70" y="208" width="80" height="84"></rect>
          <path d="M70 236 H150 M70 264 H150 M97 208 V292 M123 208 V292" fill="none"></path>
        </g>
        <rect x="668" y="246" width="62" height="9" fill="#2a2f37"></rect>
        <path d="M730 244 L738 249 L733 252 L741 257 L729 257 Z" fill="#2a2f37"></path>
        <g transform="rotate(21 760 300)" fill="#0f1a2c" stroke="#3b4a63" stroke-width="1.2">
          <path d="M745 262 L800 262 L800 300 L782 312 L772 296 L745 318 Z"></path>
          <path d="M745 290 H800 M772 262 V296" fill="none"></path>

      <!-- Mast, dish, beacon, bent antenna -->
      <rect x="466" y="70" width="8" height="92" fill="url(#hullV)"></rect>

      <path d="M526 160 L548 126 L566 132" stroke="#3a414b" stroke-width="4" fill="none" stroke-linecap="round"></path>

      <path d="M422 162 H518 L538 186 L518 210 H422 L402 186 Z" fill="none" stroke="#6b7480" stroke-width="1"></path>

            <use href="#seated" x="502" y="372" width="21" height="28" fill="#aeb7c2"></use>
            <use href="#seated" x="292" y="392" width="26" height="34" fill="#c9a13b"></use>
            <use href="#seated" x="340" y="392" width="26" height="34" fill="#aeb7c2"></use>

          </g>
        </g>
        <rect x="285" y="330" width="370" height="90" rx="8" fill="none" stroke="#6f7a88" stroke-width="1.5"></rect>
        <text class="tag" x="298" y="347">CINEMA</text>
        <text class="hint" x="298" y="360">TAP TO ENTER</text>
        <!-- Battle damage: hull breach with exposed frame -->

<dialog id="playlist" aria-labelledby="pl-title">
  <h2 id="pl-title">PIRATE SIGNAL</h2>
  <p>Music cleared for public play on this station.</p>
  <ul class="tracks" id="tracks"></ul>
  <audio id="player" controls preload="none"></audio>
  <button class="close" id="pl-close" type="button">Close</button>
</dialog>

<script>
/* Add only tracks you have the right to play publicly.
   Put the audio files next to this page (for example in /music/) and list them here. */
const PLAYLIST = [
  // { title: "Track name", artist: "Artist", src: "music/track.mp3", note: "Licensed under CC BY 4.0" },
];

(function () {
  const NS = "http://www.w3.org/2000/svg";
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const el = (name, attrs, parent) => {
    const n = document.createElementNS(NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent.appendChild(n);
    return n;
  };

  const stars = document.getElementById("stars");
  for (let i = 0; i < 320; i++) {
    const s = el("circle", { cx: (rnd() * 1600).toFixed(1), cy: (rnd() * 760).toFixed(1), r: (0.3 + rnd() * 1.2).toFixed(2), fill: rnd() > 0.85 ? "#ffe2c4" : "#dfe8ff" }, stars);
    if (rnd() > 0.82) { s.setAttribute("class", "twinkle"); s.style.animationDelay = (-rnd() * 3).toFixed(2) + "s"; }
    else s.setAttribute("opacity", (0.35 + rnd() * 0.6).toFixed(2));
  }

  const belt = document.getElementById("belt");
  for (let i = 0; i < 150; i++) {
    const t = rnd();
    const cx = 1330 + t * 300 + (rnd() - 0.5) * 120 + t * t * 40;
    const cy = -20 + t * 900 + (rnd() - 0.5) * 60;
    const r = 1.2 + Math.pow(rnd(), 3) * 9;
    const n = 6 + Math.floor(rnd() * 3);
    let d = "";
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2, rr = r * (0.65 + rnd() * 0.5);
      d += (k ? "L" : "M") + (cx + Math.cos(a) * rr).toFixed(1) + " " + (cy + Math.sin(a) * rr * 0.8).toFixed(1);
    }
    const shade = 70 + Math.floor(rnd() * 60);
    el("path", { d: d + "Z", fill: `rgb(${shade + 20},${shade + 8},${shade - 6})`, opacity: (0.55 + rnd() * 0.45).toFixed(2) }, belt);
  }

  const mf = document.getElementById("marsfeatures");
  for (let i = 0; i < 26; i++) {
    el("ellipse", { cx: (rnd() * 1600).toFixed(0), cy: (735 + rnd() * 300).toFixed(0), rx: (60 + rnd() * 220).toFixed(0), ry: (8 + rnd() * 26).toFixed(0), fill: rnd() > 0.5 ? "#5a1d0e" : "#e09060", opacity: (0.12 + rnd() * 0.18).toFixed(2), filter: "url(#soft)" }, mf);
  }
  for (let i = 0; i < 40; i++) {
    const x = 120 + rnd() * 1360, y = 712 + rnd() * 200, r = 1.5 + rnd() * 6;
    el("ellipse", { cx: x.toFixed(1), cy: y.toFixed(1), rx: r.toFixed(1), ry: (r * 0.35).toFixed(1), fill: "none", stroke: "#3f130a", "stroke-opacity": "0.5", "stroke-width": "1" }, mf);
  }

  // Arcade: five cabinets, five players in Red, Blue, Brown, Yellow and Green.
  const cab = document.getElementById("cabinets");
  const players = ["#a3262a", "#2f5fa8", "#7a5233", "#c9a227", "#3e8b47"];
  const marquee = ["#ff2d6f", "#2db8ff", "#ffb12d", "#e9ff2d", "#2dffa8"];
  players.forEach((color, i) => {
    const x = 296 + i * 76;
    el("path", { d: `M${x} 702 V612 L${x + 6} 600 H${x + 42} L${x + 48} 612 V702 Z`, fill: "#141320", stroke: "#2c2a40" }, cab);
    el("rect", { x: x + 6, y: 603, width: 36, height: 6, fill: marquee[i], opacity: "0.85" }, cab);
    el("rect", { x: x + 7, y: 614, width: 34, height: 26, fill: "#05060a" }, cab);
    for (let p = 0; p < 7; p++) {
      const px = el("rect", { x: (x + 9 + Math.floor(rnd() * 28)).toFixed(0), y: (616 + Math.floor(rnd() * 20)).toFixed(0), width: 3, height: 3, fill: marquee[(i + p) % 5], class: "px" }, cab);
      px.style.animationDelay = (-rnd() * 1.6).toFixed(2) + "s";
    }
    el("rect", { x: x + 4, y: 646, width: 40, height: 8, fill: "#22202f" }, cab);
    el("use", { href: "#standing", x: x + 9, y: 640, width: 30, height: 74, fill: color }, cab);
  });

  // Playlist dialog
  const dlg = document.getElementById("playlist");
  const list = document.getElementById("tracks");
  const player = document.getElementById("player");
  if (!PLAYLIST.length) {
    const li = document.createElement("li");
    li.innerHTML = '<p style="margin:0">The signal is quiet. No tracks are loaded yet.</p>';
    list.appendChild(li);
    player.hidden = true;
  }
  PLAYLIST.forEach((t) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span></span><small></small>`;
    b.querySelector("span").textContent = t.title;
    b.querySelector("small").textContent = [t.artist, t.note].filter(Boolean).join(" · ");
    b.addEventListener("click", () => {
      list.querySelectorAll("button").forEach((x) => x.removeAttribute("aria-current"));
      b.setAttribute("aria-current", "true");
      player.src = t.src;
      player.play().catch(() => {});
    });
    li.appendChild(b);
    list.appendChild(li);
  });
  const open = (e) => { e.preventDefault(); if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", ""); };
  const ship = document.getElementById("ship");
  ship.addEventListener("click", open);
  ship.addEventListener("keydown", (e) => { if (e.key === " ") open(e); });
  document.getElementById("pl-close").addEventListener("click", () => { player.pause(); dlg.close(); });
})();
</script>
