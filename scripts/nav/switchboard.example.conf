# Cobra N.A.V. switchboard: one block per N.A.V. (one walled-off Navidrome per person).
# Lives on the SGIN at /srv/stream/navs/switchboard.conf (podsvc owns it). Edit it, then:  ./nav.sh build NAME
#
#   port = the N.A.V.'s port on the SGIN: 4533-4536 are taken, 4537-4549 are the clone slots (nav-vat.sh opens them)
#   host = its public name: HOST.songofeo.com (the gate needs it once: gate-nav.sh)
#   user = the person's Authelia username (defaults to the block's name)
#   on   = a folder under dock1a/music to switch ON for this N.A.V., one per line. Genre, artist or album.
#          on = *  switches on all of dock1a/music. Remove a line to switch a folder off.
#
# Every folder is mounted read-only: nothing is ever copied, and no N.A.V. can change or delete a song.

[eels]
container = navidrome
port = 4533
host = music
on = *

[rachel]
port = 4535
host = mustang
on = rachel
on = eels/pop
on = eels/new-age
on = eels/soundtracks

# A new clone: copy a block, give it the next free slot, switch folders on.
# [sam]
# port = 4537
# host = sam
# on = eels/metal
# on = eels/hip-hop
# on = eels/electronica/Daft Punk
